<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  {% block refresh %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/homepulse.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="app-shell">
  <aside class="top-bar app-sidebar">
    <div class="brand-lockup">
      <div class="brand-mark">HP</div>
      <div>
        <h1>{{ app_name }}</h1>
        <div class="subtitle">Home Reliability Dashboard</div>
      </div>
    </div>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('home_center') }}" class="{% if request.endpoint == 'home_center' %}active{% endif %}">Home Center</a>
      <a href="{{ url_for('internet') }}" class="{% if request.endpoint == 'internet' %}active{% endif %}">Internet Center</a>
      <a href="{{ url_for('energy_center') }}" class="{% if request.endpoint == 'energy_center' %}active{% endif %}">Energy Center</a>
      <a href="{{ url_for('solar') }}" class="{% if request.endpoint == 'solar' %}active{% endif %}">Solar Center</a>
      <a href="{{ url_for('vehicle_center') }}" class="{% if request.endpoint == 'vehicle_center' %}active{% endif %}">Vehicle Center</a>
      <a href="{{ url_for('speed_test_center') }}" class="{% if request.endpoint == 'speed_test_center' %}active{% endif %}">Speed Test</a>
      <a href="{{ url_for('email_center') }}" class="{% if request.endpoint == 'email_center' %}active{% endif %}">Email Center</a>
      <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">Settings</a>
      <a href="{{ url_for('lab') }}" class="{% if request.endpoint == 'lab' %}active{% endif %}">Lab</a>
      <a href="{{ url_for('logs') }}" class="{% if request.endpoint == 'logs' %}active{% endif %}">Logs</a>
      <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
    </nav>
  </aside>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  </div>
</body>
</html>
