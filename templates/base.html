<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  {% block refresh %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/homepulse.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="top-bar">
    <div class="brand-lockup">
      <div class="brand-mark">HP</div>
      <div>
        <h1>{{ app_name }}</h1>
        <div class="subtitle">Home Reliability Dashboard</div>
      </div>
    </div>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('internet') }}">Internet</a>
      <a href="{{ url_for('history') }}">History</a>
      <a href="{{ url_for('reports') }}">Reports</a>
      <a href="{{ url_for('settings') }}">Settings</a>
      <a href="{{ url_for('lab') }}">Lab</a>
      <a href="{{ url_for('dev') }}">Developer Console</a>
      <a href="{{ url_for('logs') }}">Logs</a>
    </nav>
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
