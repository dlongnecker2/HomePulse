{% extends "base.html" %}
{% block title %}{{ app_name }} Logs{% endblock %}
{% block content %}
<section class="dashboard-panel">
  <h2>Recent Logs</h2>
  <pre class="log-viewer">{% for line in lines %}{{ line }}
{% endfor %}</pre>
  <p class="small">Updated when this page was loaded: {{ now }}</p>
</section>
{% endblock %}
